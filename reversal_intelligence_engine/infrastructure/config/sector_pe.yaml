# ================================================================
# config/sector_pe.yaml — Sector PE Reference Bands
# ================================================================
# WHY THIS EXISTS:
#   Sector PE bands are domain knowledge, not code logic.
#   A sector analyst can update these without touching Python.
#
# STRUCTURE per sector:
#   median : typical fair-value PE for this sector
#   low    : value zone — at or below = UNDERVALUED
#   high   : premium zone — above = EXPENSIVE_VS_SECTOR
#
# BASED ON: Long-term median PE ranges for Indian + Global markets.
# UPDATE: Review annually or after major market regime changes.
# ================================================================

sectors:

  # --- Financials ---
  Financial Services:
    median: 16
    low: 10
    high: 22

