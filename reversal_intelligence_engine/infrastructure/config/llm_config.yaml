# ================================================================
# config/llm_config.yaml — LLM Model & Inference Configuration
# ================================================================
# WHY THIS EXISTS:
#   Centralizes all LLM settings so switching models or tuning
#   temperature/token budgets requires zero code changes.
#
# HOW TO SWITCH MODEL:
#   Change `default_model` below. No Python edits needed.
#   Available: gpt-4.1-mini | gpt-4.1-nano | gpt-4.1 | gpt-4o-mini | gpt-4o
# ================================================================

# Primary model used for all LLM calls
default_model: "gpt-4.1-mini"

# Inference settings
default_temperature: 0.2
default_max_tokens: 1200

# Retry policy
# retries = number of EXTRA attempts after first failure
# Total attempts = retries + 1
retries: 2
retry_delay_seconds: 1

